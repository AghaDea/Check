<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل فرمت فیلم</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .box {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>تبدیل فرمت فیلم</h2>

        <form method="post" enctype="multipart/form-data">
            <label>فیلم را انتخاب کنید:</label>
            <input type="file" name="video" accept="video/*" required>

            <label>فرمت خروجی:</label>
            <select name="format">
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
                <option value="ogv">OGV</option>
                <option value="avi">AVI</option>
                <option value="mkv">MKV</option>
                <option value="mov">MOV</option>
                <option value="flv">FLV</option>
            </select>

            <button type="submit">شروع تبدیل</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
