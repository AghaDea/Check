<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaDrop Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#fff;font-family:Tahoma,Arial}.app{max-width:1100px;margin:auto;padding:15px}.card{background:#0d121a;border:1px solid #202a38;border-radius:19px;padding:17px;margin-bottom:14px}input{width:100%;background:#080b10;color:#fff;border:1px solid #293449;border-radius:10px;padding:12px;margin:7px 0}.btn{border:0;border-radius:9px;padding:9px 13px;background:#6078ff;color:#fff;cursor:pointer}.red{background:#8c2c3a}.hidden{display:none}.err{color:#ff6378}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #202a38;text-align:right;font-size:11px}.scroll{overflow:auto}.muted{color:#8490a4;font-size:10px}</style></head><body><div class="app"><div class="card"><b>MediaDrop Admin</b></div>
<div id="login" class="card"><input id="secret" type="password" placeholder="Admin Secret"><button class="btn" onclick="login()">ورود</button><div id="err" class="err"></div></div>
<div id="panel" class="hidden card"><h3>فایل‌ها و دستگاه‌ها</h3><div class="scroll"><table><thead><tr><th>نام</th><th>نوع</th><th>حجم</th><th>IP</th><th>Device</th><th>تاریخ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const ENDPOINT="https://ihbsxjgzrhnssluqooqh.supabase.co/functions/v1/media-upload";let S="";
async function login(){S=document.getElementById("secret").value;let r=await fetch(ENDPOINT+"/admin",{headers:{"x-admin-secret":S}});if(!r.ok){document.getElementById("err").textContent="کلید نادرست است";return}document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");load()}
async function load(){let r=await fetch(ENDPOINT+"/admin",{headers:{"x-admin-secret":S}}),d=await r.json();document.getElementById("rows").innerHTML=(d.items||[]).map(x=>`<tr><td>${e(x.original_name)}<br><span class="muted">${e(x.public_url)}</span></td><td>${e(x.mime)}</td><td>${x.size_bytes}</td><td>${e(x.ip_address||"-")}</td><td>${e(x.device_id)}</td><td>${new Date(x.created_at).toLocaleString("fa-IR")}</td><td><button class="btn red" onclick="del('${x.id}')">حذف</button></td></tr>`).join("")}
async function del(id){if(!confirm("حذف کامل فایل؟"))return;let r=await fetch(ENDPOINT+"/admin/"+id,{method:"DELETE",headers:{"x-admin-secret":S}});if(r.ok)load();else alert("خطا")}
function e(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
