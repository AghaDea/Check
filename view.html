<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR View</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#070910;color:#f5f7ff;font-family:Tahoma,Arial}.app{max-width:720px;margin:auto;padding:16px}.card{background:#0e121b;border:1px solid #222b3e;border-radius:20px;padding:20px}.title{font-size:24px;font-weight:900}.meta{color:#929db3;font-size:12px;margin:7px 0 18px}.content{background:#080b12;padding:17px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.9}.content a{color:#94a1ff}.photo{max-width:100%;max-height:75vh;display:block;margin:auto;border-radius:14px}.err{color:#ff7786;text-align:center}</style></head><body><div class="app"><div class="card" id="app">در حال دریافت...</div></div><script>
const U=localStorage.getItem("qr_supabase_url"),K=localStorage.getItem("qr_supabase_key"),id=new URLSearchParams(location.search).get("id"),app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
(async()=>{if(!U||!K){app.innerHTML='<div class="err">تنظیمات Supabase در این مرورگر وجود ندارد.</div>';return}if(!id){app.innerHTML='<div class="err">شناسه QR وجود ندارد.</div>';return}const db=supabase.createClient(U,K),r=await db.from("qr_items").select("*").eq("id",id).single();if(r.error||!r.data){app.innerHTML='<div class="err">QR پیدا نشد.</div>';return}const d=r.data;let b;if(d.type==="image")b='<img class="photo" src="'+esc(d.content)+'">';else if(d.type==="url")b='<div class="content"><a target="_blank" rel="noopener" href="'+esc(d.content)+'">'+esc(d.content)+'</a></div>';else b='<div class="content">'+esc(d.content)+'</div>';app.innerHTML='<div class="title">'+esc(d.title)+'</div><div class="meta">'+esc(d.type)+' • '+new Date(d.created_at).toLocaleString("fa-IR")+'</div>'+b})()
</script></body></html>
