<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a10;color:#f5f7ff;font-family:Tahoma,Arial}.app{max-width:720px;margin:auto;padding:18px}.card{background:#0e121b;border:1px solid #222a3b;border-radius:22px;padding:20px}.title{font-size:24px;font-weight:900;margin-bottom:7px}.meta{color:#929db3;font-size:12px;margin-bottom:20px}.content{background:#090c13;border-radius:16px;padding:18px;white-space:pre-wrap;word-break:break-word;line-height:1.9}.content a{color:#8d9aff}.photo{max-width:100%;max-height:70vh;display:block;margin:auto;border-radius:15px}.err{text-align:center;color:#ff7887}
</style>
</head>
<body><div class="app"><div class="card" id="app">در حال دریافت...</div></div>
<script>
const SUPABASE_URL="https://YOUR-PROJECT.supabase.co",SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get("id");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
(async()=>{
 if(!id){app.innerHTML='<div class="err">شناسه QR وجود ندارد.</div>';return}
 const {data,error}=await db.from("qr_items").select("*").eq("id",id).single();
 if(error||!data){app.innerHTML='<div class="err">این QR پیدا نشد یا حذف شده است.</div>';return}
 let body="";
 if(data.type==="image") body=`<img class="photo" src="${esc(data.content)}" alt="${esc(data.title)}">`;
 else if(data.type==="url"){const safe=/^https?:\/\//i.test(data.content)?data.content:"#";body=`<div class="content"><a href="${esc(safe)}" target="_blank" rel="noopener">${esc(data.content)}</a></div>`}
 else body=`<div class="content">${esc(data.content)}</div>`;
 app.innerHTML=`<div class="title">${esc(data.title)}</div><div class="meta">${esc(data.type)} • ${new Date(data.created_at).toLocaleString("fa-IR")}</div>${body}`;
})();
</script></body></html>
