<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop — File</title><link rel="stylesheet" href="style.css">
</head><body>
<main class="shell"><section class="card viewer">
<div class="brand"><span class="logo">◈</span><div><b>Drop</b><small>File viewer</small></div></div>
<div id="media" class="media"></div>
<div id="name" class="filename"></div>
<div class="stats"><div><b id="views">—</b><span>Views</span></div><div><b id="downloads">—</b><span>Downloads</span></div><div><b id="size">—</b><span>Size</span></div></div>
<div class="meta"><span id="date">—</span><span id="type">—</span></div>
<a id="download" class="btn full" href="#" download>Download file</a>
<div id="status" class="status"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="view.js"></script>
</body></html>
