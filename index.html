<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users Wiki</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f8f9fa;
 color:#202122;
 font-family:Arial,sans-serif
}

header{
 background:#fff;
 border-bottom:1px solid #a2a9b1;
 padding:18px 22px;
 font-family:Georgia,serif;
 font-size:25px
}

main{
 max-width:900px;
 margin:auto;
 padding:25px 16px
}

h1{
 font-family:Georgia,serif;
 font-weight:normal;
 border-bottom:1px solid #a2a9b1;
 padding-bottom:8px
}

.user{
 background:white;
 border:1px solid #a2a9b1;
 padding:16px;
 margin:12px 0
}

.name{
 font-size:21px;
 color:#0645ad;
 font-weight:bold;
 margin-bottom:10px
}

.label{
 color:#54595d;
 font-size:14px;
 margin-top:7px
}

.reason{
 margin-top:3px
}

.count{
 color:#b32424;
 font-weight:bold
}

#users{
 min-height:50px
}
</style>
</head>

<body>

<header>Users Wiki</header>

<main>

<h1>Cheat Records</h1>

<div id="users">Loading...</div>

</main>

<script>

const SUPABASE_URL =
"https://ihbsxjgzrhnssluqooqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj";


async function loadUsers(){

 const response = await fetch(
  SUPABASE_URL +
  "/rest/v1/Users?select=name,reason,cheat_count&order=cheat_count.desc",
  {
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  }
 );

 if(!response.ok){
  document.getElementById("users").textContent =
  "Failed to load users.";
  return;
 }

 const users = await response.json();

 if(!users.length){
  document.getElementById("users").textContent =
  "No users found.";
  return;
 }

 document.getElementById("users").innerHTML =
 users.map(user => `

  <div class="user">

   <div class="name">
    ${escapeHTML(user.name)}
   </div>

   <div class="label">
    Cheat reason
   </div>

   <div class="reason">
    ${escapeHTML(user.reason)}
   </div>

   <div class="label">
    Cheat repetitions
   </div>

   <div class="count">
    +${user.cheat_count}
   </div>

  </div>

 `).join("");
}


function escapeHTML(value){

 return String(value).replace(/[&<>"']/g,char => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[char]));

}


loadUsers();

</script>

</body>
</html>
