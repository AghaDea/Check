<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Players Wiki</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f8f9fa;
 color:#202122;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
header{
 background:#fff;
 border-bottom:1px solid #a2a9b1;
 padding:18px 22px;
 font-size:24px;
 font-weight:600
}
main{
 max-width:900px;
 margin:25px auto;
 padding:0 18px
}
h1{
 font-family:Georgia,serif;
 font-weight:normal;
 border-bottom:1px solid #a2a9b1;
 padding-bottom:8px
}
.user{
 background:#fff;
 border:1px solid #a2a9b1;
 margin:12px 0;
 padding:16px 18px
}
.name{
 font-size:20px;
 color:#0645ad;
 font-weight:600;
 margin-bottom:8px
}
.row{
 margin:5px 0;
 color:#54595d
}
.reason{
 color:#202122
}
.count{
 font-weight:bold;
 color:#b32424
}
</style>
</head>

<body>

<header>Players Wiki</header>

<main>
<h1>Cheat Records</h1>
<div id="users">Loading...</div>
</main>

<script>
const SUPABASE_URL = "https://ihbsxjgzrhnssluqooqh.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";

/* اطلاعات بازیکنی که می‌خواهی ثبت شود */
const playerName = "ali";
const cheatReason = "Speed Hack";
const cheatAmount = 1;


async function addCheat(){
    const res = await fetch(
        SUPABASE_URL + "/rest/v1/rpc/add_cheat",
        {
            method:"POST",
            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + SUPABASE_KEY,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                p_name:playerName,
                p_reason:cheatReason,
                p_amount:cheatAmount
            })
        }
    );

    if(!res.ok){
        console.error(await res.text());
        return;
    }

    loadUsers();
}


async function loadUsers(){
    const res = await fetch(
        SUPABASE_URL + "/rest/v1/Users?select=*&order=cheat_count.desc",
        {
            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + SUPABASE_KEY
            }
        }
    );

    const users = await res.json();

    document.getElementById("users").innerHTML = users.map(u => `
        <div class="user">
            <div class="name">${escapeHtml(u.name)}</div>
            <div class="row">
                Reason:
                <span class="reason">${escapeHtml(u.reason)}</span>
            </div>
            <div class="row">
                Cheat repetitions:
                <span class="count">+${u.cheat_count}</span>
            </div>
        </div>
    `).join("");
}


function escapeHtml(x){
    return String(x).replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}


addCheat();
</script>

</body>
</html>
