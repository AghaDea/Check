<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>QR Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#080a10;color:#f5f7ff}
.app{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:25px;font-weight:900}.badge{font-size:12px;color:#9da7bc;background:#111622;border:1px solid #222a3b;padding:8px 11px;border-radius:99px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#0e121b;border:1px solid #20283a;border-radius:22px;padding:18px;box-shadow:0 15px 45px #0005}
h2{font-size:18px;margin:0 0 15px}label{display:block;color:#aeb7ca;font-size:13px;margin:14px 0 7px}
input,textarea,select{width:100%;border:1px solid #293248;background:#090c13;color:#fff;border-radius:13px;padding:13px;font:inherit;outline:none}
textarea{min-height:130px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#667cff}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #293248;background:#101522;color:#cbd3e4;padding:10px 13px;border-radius:12px;cursor:pointer}.tab.active{background:#5b6cff;color:#fff;border-color:#5b6cff}
button{border:0;border-radius:13px;padding:13px 16px;background:#5b6cff;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#171d2a}.danger{background:#7b2631}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#drop{border:1px dashed #39445c;border-radius:15px;padding:25px;text-align:center;color:#9da7bc;cursor:pointer}
#preview{min-height:310px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:17px;padding:20px}
#qrcode img{display:block;margin:auto}.status{font-size:13px;color:#9da7bc;margin-top:12px;min-height:20px}.success{color:#69e6a6}.error{color:#ff7887}
.result{word-break:break-all;background:#080b12;border-radius:12px;padding:11px;font-size:12px;color:#9faac0;margin-top:10px}
.history{margin-top:16px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #20283a;padding:12px 0}.item small{color:#8f99ad}.item a{color:#9ba7ff;text-decoration:none}
.hidden{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}.app{padding:13px}.card{border-radius:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">QR Studio</div><div class="badge">Supabase • QR</div></div>

  <div class="grid">
    <section class="card">
      <h2>ساخت QR جدید</h2>
      <label>عنوان</label>
      <input id="title" maxlength="100" placeholder="مثلاً کارت ویزیت من">

      <label>نوع محتوا</label>
      <div class="tabs">
        <button class="tab active" data-type="text">متن</button>
        <button class="tab" data-type="url">لینک</button>
        <button class="tab" data-type="image">عکس</button>
      </div>

      <div id="textBox">
        <label>متن</label>
        <textarea id="text" placeholder="متن موردنظر را وارد کنید..."></textarea>
      </div>

      <div id="urlBox" class="hidden">
        <label>لینک</label>
        <input id="url" type="url" placeholder="https://example.com">
      </div>

      <div id="imageBox" class="hidden">
        <label>عکس</label>
        <div id="drop">برای انتخاب عکس لمس کنید<br><small>JPG / PNG / WEBP — حداکثر 5MB</small></div>
        <input id="file" type="file" accept="image/*" class="hidden">
        <div id="fileName" class="status"></div>
      </div>

      <label>اندازه QR</label>
      <select id="size"><option value="220">220 × 220</option><option value="280" selected>280 × 280</option><option value="340">340 × 340</option></select>

      <div class="row" style="margin-top:15px">
        <button id="create">ساخت QR</button>
        <button id="download" class="secondary">دانلود PNG</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <h2>پیش‌نمایش</h2>
      <div id="preview"><div id="qrcode"></div></div>
      <div id="result" class="result">هنوز QR ساخته نشده است.</div>
      <div class="row" style="margin-top:10px">
        <button id="copy" class="secondary">کپی لینک</button>
        <button id="open" class="secondary">باز کردن</button>
      </div>
    </section>
  </div>

  <section class="card history">
    <h2>QRهای اخیر</h2>
    <div id="history">در حال دریافت...</div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const {createClient} = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let type="text", selectedFile=null, currentUrl="", currentId="";

const $=id=>document.getElementById(id);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); type=b.dataset.type;
  $("textBox").classList.toggle("hidden",type!=="text");
  $("urlBox").classList.toggle("hidden",type!=="url");
  $("imageBox").classList.toggle("hidden",type!=="image");
});
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>{selectedFile=e.target.files[0]||null;$("fileName").textContent=selectedFile?selectedFile.name:"";};
$("drop").ondragover=e=>e.preventDefault();
$("drop").ondrop=e=>{e.preventDefault();selectedFile=e.dataTransfer.files[0]||null;$("fileName").textContent=selectedFile?selectedFile.name:"";};

function msg(t,err=false){$("status").textContent=t;$("status").className="status "+(err?"error":"success");}
function makeQR(value){
  $("qrcode").innerHTML="";
  new QRCode($("qrcode"),{text:value,width:+$("size").value,height:+$("size").value,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M});
}
function getValue(){
  if(type==="text") return $("text").value.trim();
  if(type==="url"){
    const v=$("url").value.trim();
    if(!/^https?:\\/\\//i.test(v)) throw new Error("لینک باید با http:// یا https:// شروع شود.");
    return v;
  }
  return "";
}
$("create").onclick=async()=>{
  try{
    msg("در حال ساخت...");
    let content=getValue(), filePath=null;
    if(type==="text"&&!content) throw new Error("متن را وارد کنید.");
    if(type==="url"&&!content) throw new Error("لینک را وارد کنید.");
    if(type==="image"){
      if(!selectedFile) throw new Error("یک عکس انتخاب کنید.");
      if(selectedFile.size>5*1024*1024) throw new Error("حجم عکس بیشتر از 5MB است.");
      if(!selectedFile.type.startsWith("image/")) throw new Error("فایل باید عکس باشد.");
    }

    const {data:row,error:e1}=await db.from("qr_items").insert({
      title:$("title").value.trim()||"QR جدید",type,content:type==="image"?null:content
    }).select().single();
    if(e1) throw e1;

    if(type==="image"){
      filePath=row.id+"/"+Date.now()+"_"+selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const {error:e2}=await db.storage.from("qr-files").upload(filePath,selectedFile,{upsert:false});
      if(e2) throw e2;
      const {data:pub}=db.storage.from("qr-files").getPublicUrl(filePath);
      content=pub.publicUrl;
      const {error:e3}=await db.from("qr_items").update({content,file_path:filePath}).eq("id",row.id);
      if(e3) throw e3;
    }

    const viewUrl=new URL("view.html",location.href); viewUrl.searchParams.set("id",row.id);
    currentId=row.id; currentUrl=viewUrl.href;
    makeQR(currentUrl); $("result").textContent=currentUrl;
    msg("QR با موفقیت ساخته شد.");
    loadHistory();
  }catch(e){console.error(e);msg(e.message||"خطا در ساخت QR",true);}
};
$("download").onclick=()=>{
  const img=$("qrcode img"); if(!img){msg("اول QR بسازید.",true);return;}
  const a=document.createElement("a");a.href=img.src;a.download="qr-"+(currentId||"code")+".png";a.click();
};
$("copy").onclick=async()=>{if(!currentUrl)return msg("اول QR بسازید.",true);await navigator.clipboard.writeText(currentUrl);msg("لینک کپی شد.");};
$("open").onclick=()=>{if(currentUrl)location.href=currentUrl;else msg("اول QR بسازید.",true);};

async function loadHistory(){
  const {data,error}=await db.from("qr_items").select("id,title,type,created_at").order("created_at",{ascending:false}).limit(20);
  if(error){$("history").textContent="خطا در دریافت لیست.";return;}
  if(!data.length){$("history").textContent="هنوز چیزی ساخته نشده.";return;}
  $("history").innerHTML=data.map(x=>{
    const u="view.html?id="+encodeURIComponent(x.id);
    return `<div class="item"><div><b>${escapeHtml(x.title)}</b><br><small>${x.type} • ${new Date(x.created_at).toLocaleString("fa-IR")}</small></div><a href="${u}">مشاهده</a></div>`;
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
loadHistory();
</script>
</body>
</html>
