<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070910;color:#f5f7ff;font-family:Tahoma,Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:25px;font-weight:900}.badge{font-size:12px;color:#aeb8cb;background:#111624;border:1px solid #252d40;padding:8px 11px;border-radius:99px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{background:#0e121b;border:1px solid #222b3e;border-radius:20px;padding:18px}
h2{font-size:18px;margin:0 0 15px}label{display:block;color:#aab4c8;font-size:13px;margin:13px 0 7px}
input,textarea,select{width:100%;border:1px solid #2b354b;background:#080b12;color:#fff;border-radius:12px;padding:12px;font:inherit;outline:0}
textarea{min-height:125px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#6878ff}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{background:#121824;color:#cbd3e3;border:1px solid #2a3449;padding:10px 14px;border-radius:12px;cursor:pointer}.tab.active{background:#596aff;color:#fff;border-color:#596aff}
button{border:0;border-radius:12px;padding:12px 15px;background:#596aff;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#171e2d}.danger{background:#852b37}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
#drop{border:1px dashed #3a465e;border-radius:14px;padding:24px;text-align:center;color:#9ba7bb;cursor:pointer}
#preview{min-height:310px;background:#fff;border-radius:15px;display:flex;align-items:center;justify-content:center;padding:20px}
#qrcode img{display:block;margin:auto}.status{min-height:21px;margin-top:10px;font-size:13px;color:#9ba7bb}.ok{color:#67e5a5}.bad{color:#ff7786}
.result{background:#080b12;border-radius:11px;padding:10px;margin-top:10px;font-size:12px;word-break:break-all;color:#a8b2c6}
.item{border-top:1px solid #222b3e;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.item small{color:#8994aa}.item a{color:#9ca8ff;text-decoration:none}
.hidden{display:none!important}.setup{margin-bottom:15px;border:1px solid #3b354d;background:#171221}.setup p{font-size:12px;color:#b4acc0;line-height:1.8;margin:6px 0}
@media(max-width:720px){.grid{grid-template-columns:1fr}.app{padding:12px}.card{border-radius:17px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">QR Studio</div><div class="badge">Supabase QR</div></div>

<section class="card setup" id="setup">
<h2>اتصال Supabase</h2>
<p>URL و Anon Key پروژه را یک‌بار وارد کن. در مرورگر ذخیره می‌شوند.</p>
<label>Supabase URL</label><input id="surl" placeholder="https://ihbsxjgzrhnssluqooqh.supabase.co">
<label>Anon Key</label><input id="skey" placeholder="sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj">
<div class="row" style="margin-top:10px"><button id="saveConfig">ذخیره اتصال</button><button id="clearConfig" class="secondary">پاک کردن</button></div>
<div id="configStatus" class="status"></div>
</section>

<div class="grid">
<section class="card">
<h2>ساخت QR جدید</h2>
<label>عنوان</label><input id="title" maxlength="100" placeholder="مثلاً لینک من">
<label>نوع محتوا</label>
<div class="tabs">
<button class="tab active" data-type="text">متن</button>
<button class="tab" data-type="url">لینک</button>
<button class="tab" data-type="image">عکس</button>
</div>

<div id="textBox"><label>متن</label><textarea id="text" placeholder="متن موردنظر..."></textarea></div>
<div id="urlBox" class="hidden"><label>لینک</label><input id="url" placeholder="https://example.com"></div>
<div id="imageBox" class="hidden">
<label>عکس</label><div id="drop">برای انتخاب عکس لمس کنید<br><small>حداکثر 5MB</small></div>
<input id="file" type="file" accept="image/*" class="hidden"><div id="fileName" class="status"></div>
</div>

<label>اندازه QR</label><select id="size"><option value="220">220</option><option value="280" selected>280</option><option value="340">340</option></select>
<div class="row" style="margin-top:15px"><button id="create">ساخت QR</button><button id="download" class="secondary">دانلود PNG</button></div>
<div id="status" class="status"></div>
</section>

<section class="card">
<h2>پیش‌نمایش</h2><div id="preview"><div id="qrcode"></div></div>
<div id="result" class="result">هنوز QR ساخته نشده.</div>
<div class="row" style="margin-top:10px"><button id="copy" class="secondary">کپی لینک</button><button id="open" class="secondary">باز کردن</button></div>
</section>
</div>

<section class="card" style="margin-top:15px"><h2>QRهای اخیر</h2><div id="history">اتصال Supabase را تنظیم کنید.</div></section>
</div>

<script>
"use strict";
let db=null,type="text",selectedFile=null,currentUrl="",currentId="";

const $=id=>document.getElementById(id);
function setStatus(t,bad=false){$("status").textContent=t;$("status").className="status "+(bad?"bad":"ok")}
function configStatus(t,bad=false){$("configStatus").textContent=t;$("configStatus").className="status "+(bad?"bad":"ok")}

function connect(){
 const url=localStorage.getItem("qr_supabase_url"),key=localStorage.getItem("qr_supabase_key");
 if(!url||!key){db=null;return false}
 try{db=supabase.createClient(url,key);return true}catch(e){db=null;return false}
}
function makeQR(value){
 $("qrcode").innerHTML="";
 new QRCode($("qrcode"),{text:value,width:+$("size").value,height:+$("size").value,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.type;
 $("textBox").classList.toggle("hidden",type!=="text");$("urlBox").classList.toggle("hidden",type!=="url");$("imageBox").classList.toggle("hidden",type!=="image");
}));

$("drop").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",e=>{selectedFile=e.target.files[0]||null;$("fileName").textContent=selectedFile?selectedFile.name:"";});

$("saveConfig").addEventListener("click",()=>{
 const u=$("surl").value.trim().replace(/\/$/,""),k=$("skey").value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)||!k){configStatus("URL یا Anon Key نامعتبر است.",true);return}
 localStorage.setItem("qr_supabase_url",u);localStorage.setItem("qr_supabase_key",k);
 if(connect()){configStatus("اتصال ذخیره شد.");$("setup").style.display="none";loadHistory()}else configStatus("اتصال برقرار نشد.",true);
});
$("clearConfig").addEventListener("click",()=>{localStorage.removeItem("qr_supabase_url");localStorage.removeItem("qr_supabase_key");db=null;$("setup").style.display="block";configStatus("اطلاعات اتصال پاک شد.")});

$("create").addEventListener("click",async()=>{
 try{
  if(!connect())throw new Error("اول اتصال Supabase را تنظیم کنید.");
  let content="",filePath=null;
  if(type==="text"){content=$("text").value.trim();if(!content)throw new Error("متن را وارد کنید.")}
  if(type==="url"){content=$("url").value.trim();if(!/^https?:\/\//i.test(content))throw new Error("لینک باید با http:// یا https:// شروع شود.")}
  if(type==="image"){if(!selectedFile)throw new Error("عکس را انتخاب کنید.");if(selectedFile.size>5242880)throw new Error("حجم عکس بیشتر از 5MB است.")}
  setStatus("در حال ساخت...");
  const ins=await db.from("qr_items").insert({title:$("title").value.trim()||"QR جدید",type,content:type==="image"?null:content}).select().single();
  if(ins.error)throw ins.error;
  if(type==="image"){
   filePath=ins.data.id+"/"+Date.now()+"_"+selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const up=await db.storage.from("qr-files").upload(filePath,selectedFile);
   if(up.error)throw up.error;
   content=db.storage.from("qr-files").getPublicUrl(filePath).data.publicUrl;
   const up2=await db.from("qr_items").update({content,file_path:filePath}).eq("id",ins.data.id);
   if(up2.error)throw up2.error;
  }
  const u=new URL("view.html",location.href);u.searchParams.set("id",ins.data.id);
  currentId=ins.data.id;currentUrl=u.href;makeQR(currentUrl);$("result").textContent=currentUrl;setStatus("QR با موفقیت ساخته شد.");loadHistory();
 }catch(e){console.error(e);setStatus(e.message||"خطا",true)}
});

$("download").addEventListener("click",()=>{
 const img=$("qrcode").querySelector("img");if(!img){setStatus("اول QR بسازید.",true);return}
 const a=document.createElement("a");a.href=img.src;a.download="QR-"+(currentId||"code")+".png";document.body.appendChild(a);a.click();a.remove();
});
$("copy").addEventListener("click",async()=>{if(!currentUrl){setStatus("اول QR بسازید.",true);return}try{await navigator.clipboard.writeText(currentUrl);setStatus("لینک کپی شد.")}catch(e){setStatus("کپی خودکار مرورگر اجازه داده نشد.",true)}});
$("open").addEventListener("click",()=>{if(currentUrl)location.href=currentUrl;else setStatus("اول QR بسازید.",true)});

async function loadHistory(){
 if(!connect())return;
 const r=await db.from("qr_items").select("id,title,type,created_at").order("created_at",{ascending:false}).limit(20);
 if(r.error){$("history").textContent="خطا: "+r.error.message;return}
 $("history").innerHTML=r.data.length?r.data.map(x=>`<div class="item"><div><b>${escapeHtml(x.title)}</b><br><small>${escapeHtml(x.type)} • ${new Date(x.created_at).toLocaleString("fa-IR")}</small></div><a href="view.html?id=${encodeURIComponent(x.id)}">مشاهده</a></div>`).join(""):"هنوز QR ساخته نشده.";
}

const savedUrl=localStorage.getItem("qr_supabase_url"),savedKey=localStorage.getItem("qr_supabase_key");
if(savedUrl&&savedKey){$("surl").value=savedUrl;$("skey").value=savedKey;if(connect()){$("setup").style.display="none";loadHistory()}else configStatus("تنظیمات ذخیره‌شده نامعتبر است.",true)}
</script>
</body>
</html>
