<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Guessino — number guessing multiplayer game. Duel friends, climb leaderboards, join clans.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guessino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<title>Guessino</title>
<script src="Config/load-config.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script>
(function () {
  function baseDir() {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) {
      if (/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path = path.replace(/\/[^/]*$/, '/');
      else path = path + '/';
    }
    return path;
  }
  function go(p) {
    try { location.replace(baseDir() + p); }
    catch (e) { location.replace('/' + p); }
  }
  function active(row) {
    if (!row || !row.enabled) return false;
    if (!row.ends_at) return true;
    var end = Date.parse(row.ends_at);
    return isFinite(end) && end > Date.now();
  }
  async function boot() {
    var URL = '', KEY = '';
    try {
      var cfg = await loadGzConfig();
      URL = cfg.SUPABASE_URL || '';
      KEY = cfg.SUPABASE_ANON_KEY || '';
    } catch (e) {}
    if (URL && KEY) {
      try {
        var data = null;
        try {
          var r = await fetch(URL + '/rest/v1/rpc/site_update_normalize', {
            method: 'POST',
            headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
            body: '{}'
          });
          if (r.ok) data = await r.json();
        } catch (e) {}
        if (data && data.ok && data.active) { go('update/'); return; }
        if (!data || !data.ok) {
          var r2 = await fetch(URL + '/rest/v1/site_update?id=eq.1&select=enabled,ends_at&limit=1', {
            headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
          });
          var rows = r2.ok ? await r2.json() : [];
          if (active(rows && rows[0])) { go('update/'); return; }
        }
      } catch (e) {}
    }
    try {
      if (localStorage.getItem('gz_user_id')) go('app/');
      else go('login/');
    } catch (e) { go('login/'); }
  }
  boot();
})();
</script>
</head>
<body style="margin:0; background:#0b0f14; color:#fff;"></body>
</html>
