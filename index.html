<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users Wiki</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#fff;
 color:#202122;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
 height:58px;
 border-bottom:1px solid #eaecf0;
 display:flex;
 align-items:center;
 padding:0 25px;
}

.brand{
 font-family:Georgia,serif;
 font-size:20px;
}

.brand small{
 font-family:Arial;
 font-size:11px;
 color:#72777d;
 margin-left:7px;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:25px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #a2a9b1;
 padding-bottom:10px;
}

h1{
 font-family:Georgia,serif;
 font-size:29px;
 font-weight:normal;
 margin:0;
}

.search{
 width:270px;
 height:34px;
 border:1px solid #a2a9b1;
 display:flex;
 align-items:center;
}

.search span{
 color:#72777d;
 padding-left:9px;
}

.search input{
 border:0;
 outline:0;
 width:100%;
 height:100%;
 padding:0 9px;
 font-size:14px;
}

.info{
 display:flex;
 justify-content:space-between;
 margin:14px 0;
 color:#54595d;
 font-size:13px;
}

.table{
 border-top:1px solid #c8ccd1;
}

.item{
 display:grid;
 grid-template-columns:minmax(180px,1.2fr) 2fr 100px 130px;
 min-height:58px;
 align-items:center;
 border-bottom:1px solid #eaecf0;
}

.item:hover{
 background:#f8f9fa;
}

.head{
 background:#f8f9fa;
 font-size:12px;
 font-weight:600;
 color:#54595d;
}

.cell{
 padding:10px 12px;
 overflow:hidden;
 text-overflow:ellipsis;
}

.name{
 color:#0645ad;
 font-weight:500;
}

.reason{
 color:#202122;
}

.count{
 font-weight:600;
}

.date{
 color:#72777d;
 font-size:12px;
}

.empty{
 padding:35px 10px;
 text-align:center;
 color:#72777d;
 border-bottom:1px solid #eaecf0;
}

@media(max-width:700px){

 .container{
  padding:18px 12px;
 }

 header{
  padding:0 13px;
 }

 .top{
  display:block;
 }

 h1{
  margin-bottom:13px;
 }

 .search{
  width:100%;
 }

 .info{
  margin-top:15px;
 }

 .head{
  display:none;
 }

 .item{
  display:block;
  padding:12px 0;
 }

 .cell{
  padding:3px 8px;
 }

 .name{
  font-size:16px;
 }

 .reason:before{
  content:"Reason: ";
  color:#72777d;
 }

 .count:before{
  content:"Reports: ";
  color:#72777d;
  font-weight:normal;
 }

 .date:before{
  content:"Added: ";
 }
}
</style>
</head>

<body>

<header>
 <div class="brand">
  Users Wiki
  <small>player records</small>
 </div>
</header>

<div class="container">

 <div class="top">
  <h1>Player records</h1>

  <div class="search">
   <span>⌕</span>
   <input
    id="search"
    type="search"
    placeholder="Search..."
    autocomplete="off">
  </div>
 </div>

 <div class="info">
  <span id="result">Loading...</span>
  <span id="total"></span>
 </div>

 <div class="table">

  <div class="item head">
   <div class="cell">Player</div>
   <div class="cell">Reason</div>
   <div class="cell">Reports</div>
   <div class="cell">Added</div>
  </div>

  <div id="users"></div>

 </div>

</div>

<script>

const SUPABASE_URL =
"https://ihbsxjgzrhnssluqooqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj";

let users=[];


async function load(){

 const box=document.getElementById("users");

 try{

  const r=await fetch(
   SUPABASE_URL+
   "/rest/v1/Users?select=id,name,reason,cheat_count,created_at&order=name.asc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+SUPABASE_KEY
    }
   }
  );

  if(!r.ok){
   box.innerHTML=
   `<div class="empty">Unable to load records.</div>`;
   return;
  }

  users=await r.json();

  render();

 }catch(e){

  box.innerHTML=
  `<div class="empty">Unable to connect.</div>`;

 }

}


function render(){

 const q=
 document.getElementById("search")
 .value
 .toLowerCase()
 .trim();

 const list=users.filter(u=>
  String(u.name).toLowerCase().includes(q) ||
  String(u.reason).toLowerCase().includes(q)
 );

 document.getElementById("total").textContent=
 `${users.length} records`;

 document.getElementById("result").textContent=
 q
 ? `${list.length} matching records`
 : "All players";


 if(!list.length){

  document.getElementById("users").innerHTML=
  `<div class="empty">No matching records.</div>`;

  return;
 }


 document.getElementById("users").innerHTML=
 list.map(u=>`

  <div class="item">

   <div class="cell name">
    ${esc(u.name)}
   </div>

   <div class="cell reason">
    ${esc(u.reason)}
   </div>

   <div class="cell count">
    +${u.cheat_count}
   </div>

   <div class="cell date">
    ${date(u.created_at)}
   </div>

  </div>

 `).join("");

}


function date(x){

 if(!x)return "-";

 return new Date(x).toLocaleDateString(
  undefined,
  {
   year:"numeric",
   month:"short",
   day:"numeric"
  }
 );

}


function esc(x){

 return String(x).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}


document
.getElementById("search")
.addEventListener("input",render);

load();

</script>

</body>
</html>
