<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیدربورد بازی</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .my-name-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .my-name-box input {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .my-name-box button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .my-name-box button:hover { background: #0284c7; }
    .hint {
      width: 100%;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    th {
      background: #0ea5e9;
      color: white;
      padding: 14px 12px;
      font-size: 0.95rem;
    }
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #334155; }
    
    /* ردیف خود کاربر */
    tr.me {
      background: #0c4a6e !important;
      color: #e0f2fe;
    }
    tr.me td {
      border-color: #0369a1;
    }
    tr.me .rank {
      color: #7dd3fc;
    }
    
    .rank {
      font-weight: bold;
      color: #fbbf24;
      font-size: 1.05rem;
    }
    .player-name {
      font-weight: 600;
      color: #f1f5f9;
    }
    .wins {
      color: #4ade80;
      font-weight: bold;
    }
    .guesses {
      color: #a78bfa;
    }
    .date {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .loading, .empty {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    .refresh-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 22px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 لیدربورد بازی</h1>
    <p class="subtitle">نام · بردها · کل حدس‌ها · آخرین برد</p>

    <!-- کادر شناسایی خود کاربر -->
    <div class="my-name-box">
      <input type="text" id="myNameInput" placeholder="اسم خودت رو بنویس تا ردیفت آبی بشه...">
      <button onclick="saveMyName()">ذخیره</button>
      <div class="hint">اسمی که اینجا می‌نویسی فقط روی دستگاه خودت ذخیره می‌شه و ردیف‌ت آبی می‌شه</div>
    </div>

    <div id="status" class="loading">در حال بارگذاری...</div>

    <table id="leaderboard" style="display:none;">
      <thead>
        <tr>
          <th>رتبه</th>
          <th>نام بازیکن</th>
          <th>بردها</th>
          <th>کل حدس‌ها</th>
          <th>آخرین برد</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <button class="refresh-btn" onclick="loadLeaderboard()">بروزرسانی</button>
  </div>

  <script>
    // ===== تنظیمات سوپابیس =====
    const SUPABASE_URL = 'https://ihbsxjgzrhnssluqooqh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj';   // کلید anon خودت رو بذار

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // بارگذاری اسم ذخیره‌شده
    const savedName = localStorage.getItem('myPlayerName') || '';
    document.getElementById('myNameInput').value = savedName;

    function saveMyName() {
      const name = document.getElementById('myNameInput').value.trim();
      localStorage.setItem('myPlayerName', name);
      loadLeaderboard(); // دوباره رندر کن تا رنگ عوض بشه
    }

    async function loadLeaderboard() {
      const status = document.getElementById('status');
      const table = document.getElementById('leaderboard');
      const tbody = document.getElementById('tbody');

      status.style.display = 'block';
      status.textContent = 'در حال بارگذاری...';
      table.style.display = 'none';

      const { data, error } = await supabase
        .from('leaderboard')
        .select('player_name, wins, guesses, last_win_at')
        .order('wins', { ascending: false })
        .limit(100);

      if (error) {
        status.textContent = 'خطا: ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = 'هنوز هیچ بازیکنی ثبت نشده.';
        return;
      }

      status.style.display = 'none';
      table.style.display = 'table';
      tbody.innerHTML = '';

      const myName = (localStorage.getItem('myPlayerName') || '').trim().toLowerCase();

      data.forEach((row, index) => {
        const isMe = myName && row.player_name.toLowerCase() === myName;
        const date = new Date(row.last_win_at).toLocaleString('fa-IR');

        tbody.innerHTML += `
          <tr class="${isMe ? 'me' : ''}">
            <td class="rank">#${index + 1}</td>
            <td class="player-name">${row.player_name}${isMe ? ' (تو)' : ''}</td>
            <td class="wins">${row.wins}</td>
            <td class="guesses">${row.guesses || 0}</td>
            <td class="date">${date}</td>
          </tr>
        `;
      });
    }

    // اولین بار
    loadLeaderboard();

    // هر ۴۵ ثانیه خودکار بروزرسانی
    setInterval(loadLeaderboard, 45000);
  </script>
</body>
</html>
