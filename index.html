<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0b1120;
      color:#e2e8f0;
      min-height:100vh;
      padding:24px 16px;
    }
    .wrap{max-width:720px;margin:0 auto}
    h1{
      font-size:1.55rem;
      font-weight:700;
      text-align:center;
      color:#38bdf8;
      margin-bottom:4px;
    }
    .sub{
      text-align:center;
      color:#64748b;
      font-size:.85rem;
      margin-bottom:20px;
    }
    .search-box{margin-bottom:16px}
    .search-box input{
      width:100%;
      padding:12px 16px;
      border:1px solid #1e293b;
      border-radius:10px;
      background:#0f172a;
      color:#f1f5f9;
      font-size:.95rem;
      outline:none;
    }
    .search-box input:focus{border-color:#0ea5e9}
    .card{
      background:#0f172a;
      border:1px solid #1e293b;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }
    table{width:100%;border-collapse:collapse}
    th{
      background:#0ea5e9;
      color:#fff;
      font-size:.78rem;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.03em;
      padding:12px 10px;
      text-align:left;
    }
    td{
      padding:12px 10px;
      border-bottom:1px solid #1e293b;
      font-size:.9rem;
    }
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#1e293b}
    .rank{width:42px;font-weight:700;color:#fbbf24;text-align:center}
    .name{
      font-weight:600;
      color:#38bdf8;
      cursor:pointer;
      transition:color .15s;
    }
    .name:hover{color:#7dd3fc;text-decoration:underline}
    .wins{color:#4ade80;font-weight:600}
    .guesses{color:#a78bfa}
    .date{color:#94a3b8;font-size:.82rem;white-space:nowrap}
    .msg{
      text-align:center;
      padding:48px 16px;
      color:#64748b;
      font-size:.95rem;
    }
    .msg.error{color:#f87171}
    .footer{
      text-align:center;
      margin-top:14px;
      font-size:.75rem;
      color:#475569;
    }

    /* ===== ONLINE / OFFLINE ===== */
    .pname{cursor:pointer}
    .pname:hover{text-decoration:underline}
    .st{
      display:inline-flex;align-items:center;gap:5px;
      margin-left:10px;font-size:.68rem;font-weight:700;
      letter-spacing:.03em;vertical-align:middle;
    }
    .st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
    .st.on{color:#22c55e}
    .st.on::before{box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.4s infinite}
    .st.off{color:#ef4444}
    tr.is-on td{background:rgba(34,197,94,.06)}
    tr.is-on td:first-child{box-shadow:inset 3px 0 0 #22c55e}
    @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

    /* ========== PLAYER CARD MODAL ========== */
    .overlay{
      position:fixed;inset:0;
      background:rgba(2,6,23,.85);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      display:flex;align-items:center;justify-content:center;
      z-index:100;opacity:0;pointer-events:none;
      transition:opacity .25s ease;padding:20px;overflow-y:auto;
    }
    .overlay.show{opacity:1;pointer-events:auto}
    .player-card{
      position:relative;width:100%;max-width:360px;margin:auto;
      border-radius:26px;padding:2px;
      background:linear-gradient(145deg,#38bdf8,#6366f1 45%,#a855f7 75%,#f59e0b);
      box-shadow:0 30px 70px -10px rgba(0,0,0,.8),0 0 90px rgba(99,102,241,.35);
      transform:scale(.9) translateY(24px);
      transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .overlay.show .player-card{transform:none}
    .pc-inner{
      position:relative;overflow:hidden;border-radius:24px;
      background:
        radial-gradient(circle at 20% 0%,rgba(56,189,248,.28),transparent 55%),
        radial-gradient(circle at 100% 30%,rgba(168,85,247,.22),transparent 50%),
        linear-gradient(180deg,#111a33 0%,#0a1020 100%);
      padding:30px 22px 20px;text-align:center;
    }
    .pc-inner::before{ /* subtle grid texture */
      content:'';position:absolute;inset:0;opacity:.07;pointer-events:none;
      background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
      background-size:22px 22px;
    }
    .pc-inner>*{position:relative}
    .close-btn{
      position:absolute;top:-2px;right:-2px;z-index:3;
      width:34px;height:34px;border:none;border-radius:50%;
      background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem;line-height:1;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s,transform .15s;
    }
    .close-btn:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}
    .pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-right:30px}
    .pc-brand{font-size:.68rem;font-weight:700;letter-spacing:.2em;color:#94a3b8;text-transform:uppercase}
    .pc-status{
      display:inline-flex;align-items:center;gap:6px;
      font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:99px;
      border:1px solid currentColor;background:rgba(0,0,0,.25);
    }
    .pc-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
    .pc-status.on{color:#22c55e}
    .pc-status.on::before{animation:pulse 1.4s infinite}
    .pc-status.off{color:#ef4444}
    .avatar-ring{
      width:104px;height:104px;margin:0 auto 14px;border-radius:50%;padding:4px;
      background:conic-gradient(from 180deg,#38bdf8,#6366f1,#a855f7,#f59e0b,#38bdf8);
      box-shadow:0 0 40px rgba(99,102,241,.5);
    }
    .avatar{
      width:100%;height:100%;border-radius:50%;
      background:linear-gradient(145deg,#1e293b,#0b1120);
      display:flex;align-items:center;justify-content:center;
      font-size:2.6rem;font-weight:800;color:#fff;
    }
    .card-name{
      font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-.02em;
      word-break:break-word;line-height:1.2;
    }
    .card-rank{
      display:inline-flex;align-items:center;gap:6px;margin-top:10px;
      background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#422006;
      font-size:.8rem;font-weight:800;padding:5px 15px;border-radius:99px;
      box-shadow:0 4px 16px rgba(245,158,11,.35);
    }
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
    .stat{
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
      border-radius:14px;padding:13px 6px;
    }
    .stat-value{font-size:1.4rem;font-weight:800;line-height:1.1}
    .stat-label{font-size:.62rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
    .stat.wins .stat-value{color:#4ade80}
    .stat.guesses .stat-value{color:#a78bfa}
    .stat.rate .stat-value{color:#38bdf8}
    .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
    .bar>i{display:block;height:100%;width:0;border-radius:99px;
      background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7);transition:width .7s ease}
    .info-row{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:10px 2px;border-top:1px solid rgba(255,255,255,.07);font-size:.84rem;
    }
    .info-label{color:#94a3b8}
    .info-value{color:#e2e8f0;font-weight:600;text-align:right}
    .card-footer{margin-top:14px;font-size:.62rem;letter-spacing:.18em;color:#475569;text-transform:uppercase}

    @media(max-width:520px){
      th:nth-child(5),td:nth-child(5){display:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Leaderboard</h1>
    <p class="sub">Wins · Guesses · Account Created</p>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search player name..." autocomplete="off">
    </div>

    <div class="card">
      <div id="status" class="msg">Loading...</div>
      <table id="table" style="display:none">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>Player</th>
            <th>Wins</th>
            <th>Guesses</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="footer">Click a player name to view full card · Live · Online = edited in the last 3s</p>
  </div>

  <!-- PLAYER CARD OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="player-card" id="playerCard">
      <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
      <div class="pc-inner">
        <div class="pc-top">
          <span class="pc-brand">Player Card</span>
          <span class="pc-status off" id="cardStatus">Offline</span>
        </div>
        <div class="avatar-ring"><div class="avatar" id="cardAvatar">A</div></div>
        <div class="card-name" id="cardName">Player</div>
        <div class="card-rank" id="cardRank">Rank #1</div>
        <div class="stat-grid">
          <div class="stat wins"><div class="stat-value" id="cardWins">0</div><div class="stat-label">Wins</div></div>
          <div class="stat guesses"><div class="stat-value" id="cardGuesses">0</div><div class="stat-label">Guesses</div></div>
          <div class="stat rate"><div class="stat-value" id="cardRate">0%</div><div class="stat-label">Win rate</div></div>
        </div>
        <div class="bar"><i id="cardBar"></i></div>
        <div class="info-row"><span class="info-label">Account Created</span><span class="info-value" id="cardCreated">—</span></div>
        <div class="info-row"><span class="info-label">Last Win</span><span class="info-value" id="cardLastWin">—</span></div>
        <div class="card-footer">Leaderboard · Screenshot Ready</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ihbsxjgzrhnssluqooqh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj';

    let allRows = [];
    let openName = null;
    const ONLINE_MS = 3000;   // no edit for >3s => Offline
    const POLL_MS = 1500;     // fast silent polling so edits are caught live
    const seen = new Map();   // player_name -> {sig, lastChange}
    let firstLoad = true;
    let lastOnlineKey = '';

    const isOnline = r => {
      const e = seen.get(r.player_name);
      return !!(e && e.lastChange && Date.now() - e.lastChange <= ONLINE_MS);
    };

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${day} ${h}:${min}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render(rows) {
      const status = document.getElementById('status');
      const table = document.getElementById('table');
      const tbody = document.getElementById('tbody');

      if (!rows.length) {
        status.className = 'msg';
        status.textContent = firstLoad ? 'Loading...' : 'No players found';
        status.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      // players being edited right now go to the top (most recent edit first)
      const ordered = rows.map((r, i) => ({ r, i }));
      ordered.sort((a, b) => {
        const ea = isOnline(a.r) ? seen.get(a.r.player_name).lastChange : 0;
        const eb = isOnline(b.r) ? seen.get(b.r.player_name).lastChange : 0;
        return (eb - ea) || (a.i - b.i);
      });

      status.style.display = 'none';
      table.style.display = 'table';
      tbody.innerHTML = ordered.map(({ r }) => {
        const idx = allRows.indexOf(r);
        const on = isOnline(r);
        return `
        <tr class="${on ? 'is-on' : ''}">
          <td class="rank">${idx + 1}</td>
          <td class="name" data-idx="${idx}"><span class="pname">${escapeHtml(r.player_name)}</span><span class="st ${on ? 'on' : 'off'}">${on ? 'Online' : 'Offline'}</span></td>
          <td class="wins">${r.wins}</td>
          <td class="guesses">${r.guesses ?? 0}</td>
          <td class="date">${formatDate(r.created_at)}</td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('.name').forEach(el => {
        el.addEventListener('click', () => {
          const idx = +el.dataset.idx;
          openCard(allRows[idx], idx + 1);
        });
      });
    }

    function fillCard(player, rank) {
      const wins = +player.wins || 0, guesses = +player.guesses || 0;
      const rate = guesses > 0 ? Math.min(100, Math.round(wins / guesses * 100)) : 0;
      const on = isOnline(player);
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🏆';
      document.getElementById('cardAvatar').textContent = (player.player_name || '?').trim().charAt(0).toUpperCase() || '?';
      document.getElementById('cardName').textContent = player.player_name || 'Unknown';
      document.getElementById('cardRank').textContent = `${medal} Rank #${rank}`;
      document.getElementById('cardWins').textContent = wins;
      document.getElementById('cardGuesses').textContent = guesses;
      document.getElementById('cardRate').textContent = rate + '%';
      document.getElementById('cardBar').style.width = rate + '%';
      document.getElementById('cardCreated').textContent = formatDate(player.created_at);
      document.getElementById('cardLastWin').textContent = formatDate(player.last_win_at);
      const st = document.getElementById('cardStatus');
      st.className = 'pc-status ' + (on ? 'on' : 'off');
      st.textContent = on ? 'Online' : 'Offline';
    }

    function openCard(player, rank) {
      if (!player) return;
      openName = player.player_name;
      fillCard(player, rank);
      document.getElementById('overlay').classList.add('show');
    }

    function refreshOpenCard() {
      if (!openName) return;
      const i = allRows.findIndex(r => r.player_name === openName);
      if (i >= 0) fillCard(allRows[i], i + 1);
    }

    function closeCard() {
      document.getElementById('overlay').classList.remove('show');
      openName = null;
    }

    document.getElementById('closeBtn').addEventListener('click', closeCard);
    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target.id === 'overlay') closeCard();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCard();
    });

    async function load() {
      const status = document.getElementById('status');
      try {
        const url = `${SUPABASE_URL}/rest/v1/leaderboard?select=player_name,wins,guesses,created_at,last_win_at&order=wins.desc&limit=150`;
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        if (!res.ok) throw new Error(`${res.status} – ${await res.text()}`);
        const data = await res.json();
        allRows = Array.isArray(data) ? data : [];

        // detect edits: any change in wins / guesses / last win since previous poll
        const now = Date.now();
        allRows.forEach(r => {
          const sig = `${r.wins}|${r.guesses}|${r.last_win_at}`;
          const e = seen.get(r.player_name);
          if (!e) seen.set(r.player_name, { sig, lastChange: firstLoad ? 0 : now });
          else if (e.sig !== sig) { e.sig = sig; e.lastChange = now; }
        });
        firstLoad = false;
        filter();
        refreshOpenCard();
      } catch (err) {
        if (firstLoad || !allRows.length) {
          status.className = 'msg error';
          status.textContent = 'Error: ' + err.message;
          status.style.display = 'block';
          document.getElementById('table').style.display = 'none';
        }
        console.error(err);
      }
    }

    async function loop() {
      await load();
      setTimeout(loop, POLL_MS);
    }

    function filter() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const filtered = q
        ? allRows.filter(r => (r.player_name || '').toLowerCase().includes(q))
        : allRows;
      render(filtered);
    }

    document.getElementById('search').addEventListener('input', filter);

    // flip Online -> Offline exactly when the 3s window passes
    setInterval(() => {
      const key = allRows.filter(isOnline).map(r => r.player_name).join('|');
      if (key !== lastOnlineKey) {
        lastOnlineKey = key;
        filter();
        refreshOpenCard();
      }
    }, 300);

    loop();
  </script>
</body>
</html>
