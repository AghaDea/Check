<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaDrop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#f4f7fb;font-family:Tahoma,Arial}.app{max-width:950px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:25px;font-weight:900}.trust{font-size:11px;color:#aab5c7;border:1px solid #202a38;border-radius:99px;padding:8px 10px}
.card{background:#0d121a;border:1px solid #202a38;border-radius:21px;padding:18px}.upload{height:310px;display:grid;place-items:center;text-align:center;cursor:pointer}
.upload.drag{border-color:#6078ff;background:#0d1526}.ico{font-size:35px;background:#18223a;width:68px;height:68px;display:grid;place-items:center;border-radius:20px;margin:auto}
.upload h1{font-size:20px;margin:13px 0 7px}.upload p{font-size:12px;color:#8e9aae;line-height:1.8;margin:0}.limit{font-size:11px;color:#657185;margin-top:12px}
input{display:none}.status{text-align:center;color:#8f9caf;font-size:13px;min-height:22px;margin-top:10px}.ok{color:#48d49b}.err{color:#ff6478}
.progress{height:8px;background:#171e29;border-radius:9px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#6078ff}.hidden{display:none!important}
.section{margin-top:17px}.section h2{font-size:17px}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.file{background:#111823;border:1px solid #202a38;border-radius:16px;overflow:hidden}.thumb{height:145px;background:#070a0f;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:11px}.name{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#8792a7;font-size:10px;margin-top:6px}
.link{direction:ltr;text-align:left;background:#080b10;border-radius:8px;padding:7px;margin-top:8px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;margin-top:8px}
.btn{border:0;border-radius:9px;padding:9px;background:#192232;color:#fff;cursor:pointer;flex:1}.primary{background:#6078ff}.empty{text-align:center;color:#7f8a9f;padding:30px}
@media(max-width:600px){.app{padding:11px}.files{grid-template-columns:1fr 1fr}.thumb{height:120px}}
</style></head><body><div class="app">
<div class="top"><div class="logo">MediaDrop</div><div class="trust">🔒 Secure Media Upload</div></div>
<section id="home"><div class="card upload" id="drop"><div><div class="ico">↑</div><h1>عکس یا ویدیو را انتخاب کنید</h1>
<p>فقط JPG / PNG / WEBP / GIF و MP4 / WEBM / MOV</p><div class="limit">حداکثر 100MB برای هر فایل</div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></div></div>
<div id="status" class="status"></div>
<div class="section"><h2>فایل‌های اخیر</h2><div id="files" class="files"><div class="empty">در حال دریافت...</div></div></div></section>
<section id="uploading" class="card hidden"><div style="text-align:center;font-size:42px">⟳</div><h2 style="text-align:center">Uploading...</h2>
<div id="upname" class="status"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="upstatus" class="status">در حال بررسی...</div></section>
</div>
<script>
const ENDPOINT="https://ihbsxjgzrhnssluqooqh.supabase.co/functions/v1/media-upload";
const MAX=100*1024*1024,$=id=>document.getElementById(id);
const iid=localStorage.getItem("media_device_id")||crypto.randomUUID();localStorage.setItem("media_device_id",iid);
const images=["image/jpeg","image/png","image/webp","image/gif"],videos=["video/mp4","video/webm","video/quicktime"];
$("drop").onclick=()=>$("file").click();
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};
$("drop").ondragleave=()=>$("drop").classList.remove("drag");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");check(e.dataTransfer.files[0])};
$("file").onchange=e=>check(e.target.files[0]);

function setStatus(t,bad=false){$("status").textContent=t;$("status").className="status "+(bad?"err":"ok")}
function fmt(n){let u=["B","KB","MB","GB"],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
async function signature(f){let b=new Uint8Array(await f.slice(0,64).arrayBuffer()),h=Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("");
if(h.startsWith("ffd8ff"))return"image/jpeg";if(h.startsWith("89504e47"))return"image/png";if(h.startsWith("47494638"))return"image/gif";
if(h.startsWith("52494646")&&h.slice(16,24)=="57454250")return"image/webp";if(h.startsWith("1a45dfa3"))return"video/webm";
if(h.slice(8,24).includes("66747970"))return"video/mp4";return null}

async function check(f){if(!f)return;if(f.size>MAX)return setStatus("فایل بیشتر از 100MB است و آپلود نشد.",true);
let m=await signature(f);if(!m||(!images.includes(m)&&!videos.includes(m)))return setStatus("فایل رد شد؛ فقط عکس و ویدیو مجاز است.",true);upload(f,m)}

function upload(f,m){
$("home").classList.add("hidden");$("uploading").classList.remove("hidden");$("bar").style.width="0%";$("upname").textContent=f.name+" • "+fmt(f.size);
$("upstatus").textContent="در حال اتصال به سرور...";
let fd=new FormData();fd.append("file",f,f.name);fd.append("mime",m);fd.append("device_id",iid);
let x=new XMLHttpRequest();
x.open("POST",ENDPOINT,true);
x.setRequestHeader("x-client-device",iid);
x.upload.onprogress=e=>{if(e.lengthComputable){$("bar").style.width=(e.loaded/e.total*100)+"%";$("upstatus").textContent="در حال آپلود "+Math.round(e.loaded/e.total*100)+"%"}}; 
x.onload=()=>{
let raw=x.responseText||"", r={};try{r=JSON.parse(raw)}catch(_){}
if(x.status>=200&&x.status<300){$("bar").style.width="100%";$("upstatus").textContent="کامل شد؛ در حال آماده‌سازی...";setTimeout(()=>location.reload(),700)}
else fail("خطای سرور ("+x.status+"): "+(r.error||raw.slice(0,180)||"پاسخ نامعتبر"))
};
x.onerror=()=>fail("اتصال به Edge Function برقرار نشد. CORS یا Deploy تابع را بررسی کنید.");
x.ontimeout=()=>fail("زمان اتصال به سرور تمام شد.");
x.timeout=120000;
x.send(fd)
}
function fail(t){$("uploading").classList.add("hidden");$("home").classList.remove("hidden");setStatus(t,true)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){try{let r=await fetch(ENDPOINT+"/list");let d=await r.json();if(!r.ok)throw Error(d.error||"HTTP "+r.status);let a=d.items||[];
$("files").innerHTML=a.length?a.map(x=>{let v=x.mime.startsWith("video/");return`<article class="file"><div class="thumb"><img src="${esc(v?(x.thumbnail_url||""):x.url)}" ${v&&!x.thumbnail_url?'style="display:none"':''}>${v&&!x.thumbnail_url?"🎬":""}</div>
<div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.mime)} • ${fmt(x.size)} • ${new Date(x.created_at).toLocaleString("fa-IR")}</div>
<div class="link">${esc(x.short_url||x.url)}</div><div class="actions"><button class="btn primary" onclick="copy('${encodeURIComponent(x.short_url||x.url)}')">کپی</button>
<button class="btn" onclick="info('${encodeURIComponent(x.id)}')">جزئیات</button></div></div></article>`}).join(""):'<div class="empty">هنوز فایلی آپلود نشده.</div>'
}catch(e){$("files").innerHTML='<div class="empty">لیست فایل‌ها در دسترس نیست.</div>'}}
async function copy(s){await navigator.clipboard.writeText(decodeURIComponent(s));alert("لینک کپی شد")}
function info(id){alert("شناسه فایل: "+decodeURIComponent(id)+"\nDevice: "+iid)}
load();
</script></body></html>
