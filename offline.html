<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Guessino · Offline</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0b0f14; --text:#e8eef7; --dim:#8b9bb0; --accent:#3b82f6; --border:#243041; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card { max-width: 360px; width: 100%; }
  .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 8px; }
  .logo span { color: var(--accent); }
  .icon { font-size: 48px; margin-bottom: 12px; }
  p { color: var(--dim); font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(0.97); }
  .hint { margin-top: 16px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <div class="logo">Guess<span>ino</span></div>
    <p>You're offline. Check your connection and try again. Static pages may still load from cache.</p>
    <button type="button" id="retry">Try again</button>
    <div class="hint">Guessino needs internet for live play, leaderboards, and duels.</div>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload();
    });
    window.addEventListener('online', function () {
      location.reload();
    });
  </script>
</body>
</html>
